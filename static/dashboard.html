<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="dashboard.js"></script>
    <title>Printer Monitor</title>
  </head>
  <body>
    <div class="dashboard">
      <div class="camera-container">
        <div id="camera-wrapper" class="camera-feed">
          <button
            class="fullscreen-btn"
            onclick="toggleFullscreen()"
            title="Toggle Fullscreen"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
              />
            </svg>
          </button>
          <img id="printer-cam" alt="Printer Feed" />
        </div>
      </div>

      <div class="stats-grid">
        <div id="status-card" class="card">
          <div class="label">Status</div>
          <div id="status" class="value status-tag">Loading...</div>
        </div>

        <div id="printing-time-card" class="card card-third">
          <div class="label">Printing Time</div>
          <span id="printing-time" class="value">--</span>
        </div>

        <div id="estimated-remaining-time-card" class="card card-third">
          <div class="label">Remaining Time (Estimated)</div>
          <span id="estimated-remaining-time" class="value">--</span>
          <br>
          <span id="estimated-end-time" class="end-time">--</span>
        </div>

        <div id="progress-card" class="card card-full">
          <div class="label">Print Progress</div>
          <div id="percent-text" class="value">--</div>
          <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <div id="temp-nozzle-card" class="card card-half">
          <div class="label">Nozzle Temperature</div>
          <div class="temp-display">
            <span id="nozzle-temp-current" class="value">--</span>
            <span class="separator">/</span>
            <span id="nozzle-temp-target" class="target-value">--</span>
            <span class="unit">°C</span>
          </div>
        </div>

        <div id="temp-bed-card" class="card card-half">
          <div class="label">Bed Temperature</div>
          <div class="temp-display">
            <span id="bed-temp-current" class="value">--</span>
            <span class="separator">/</span>
            <span id="bed-temp-target" class="target-value">--</span>
            <span class="unit">°C</span>
          </div>
        </div>


      </div>

      <div class="controls-grid">
        <button
          id="pause-resume-btn"
          class="control-btn pause-resume"
          onclick="sendAction('pause')"
        >
          PAUSE PRINT
        </button>
        <button
          id="abort-btn"
          class="control-btn abort"
          onclick="confirmAbort()"
        >
          ABORT PRINT
        </button>
      </div>
    </div>
  </body>
</html>
